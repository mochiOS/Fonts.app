format = 1

[package]
provenance = "built-in"
id = "org.mochios.fonts"
name = "Fonts"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "Browse, preview and manage fonts"
icon = "appicon.png"
resources = ["appicon.png"]

[[binary]]
path = "/system/applications/Fonts.app/entry.elf"
kind = "application"
requires = ["fs.read.all", "fs.write.user", "ipc.client", "ipc.server", "window.create"]
